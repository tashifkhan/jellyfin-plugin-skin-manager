<!DOCTYPE html>
<html>
<head><title>taflix Skins</title></head>
<body>
    <div id="taflixSkinsPage" data-role="page" class="page type-interior pluginConfigurationPage"
         data-require="emby-select,emby-button" data-controller="__plugin/taflix-skins.js">
        <div data-role="content">
            <div class="content-primary">
                <form id="taflixSkinsForm">
                    <h2 class="sectionTitle">taflix Skins</h2>
                    <p>Select a skin and click Set Skin to update the server's Branding CSS.</p>
                    <div class="selectContainer">
                        <label class="selectLabel" for="cssOptions">Skin</label>
                        <select is="emby-select" id="cssOptions" disabled></select>
                        <div id="skinDescription" class="fieldDescription"></div>
                    </div>
                    <p id="skinStatus" role="status" aria-live="polite"></p>
                    <button is="emby-button" type="submit" id="setSkin" class="raised block" disabled>
                        <span>Set Skin</span>
                    </button>
                    <button is="emby-button" type="button" id="retrySkins" class="raised block hide">
                        <span>Retry</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
